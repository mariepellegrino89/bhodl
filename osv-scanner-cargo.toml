# osv-scanner configuration for the Cargo.lock job of
# .github/workflows/osv-scan.yml.
#
# The scanner reads Cargo.lock. The entries below mirror the reviewed
# RustSec exceptions in deny.toml [advisories].ignore and .cargo/audit.toml
# — keep all three lists in sync; see deny.toml for the full rationale and
# the upstream blockers. An entry stops matching once the affected package
# leaves Cargo.lock, at which point it can be removed here too. Same review
# discipline as deny.toml: every ignore carries a reason and a review date.
# REVIEW ALL BY 2026-12-31 or on the next bdk_esplora / uniffi release.

