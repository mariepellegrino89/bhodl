# Testcontainers configuration loaded from the test classpath.
# Documented in https://java.testcontainers.org/features/configuration/
#
# Why this file exists:
# - Docker Desktop 29 dropped HTTP API v1.43, which the docker-java
#   client bundled with Testcontainers 1.21.x calls by default.
#   Forcing v1.45 here is what makes the daemon stop returning 400.
# - Setting docker.host explicitly avoids the auto-detection
#   guessing game between the various Docker Desktop named pipes
#   and the TCP endpoint.
# - Disabling Ryuk avoids one extra container probe at startup;
#   we use @TestInstance(PER_CLASS) + @AfterAll to clean up.
docker.host=tcp\://localhost\:2375
api.version=1.45
ryuk.disabled=true
