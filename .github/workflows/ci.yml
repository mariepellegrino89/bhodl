name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only needs to read the repository. Jobs that
# need more must request it explicitly at job level.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supply chain: every third-party action is pinned to a full commit SHA
# (tag in the trailing comment, resolved 2026-10-09 via the GitHub API).
# Bump SHA and comment together. The Rust toolchain comes from
# rust-toolchain.toml via the runner's preinstalled rustup — no
# third-party toolchain action.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # bhodl-keystore links libdbus-1 for the Secret Service backend.
      - name: Install libdbus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install libdbus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --no-fail-fast

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # cargo-deny >= 0.19 is required: 0.18.x crashes on advisory-db
      # entries carrying CVSS 4.0 vectors. Versions pinned explicitly.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      # advisories + bans + licenses + sources. Reviewed exceptions live
      # in deny.toml [advisories].ignore (mirrored in .cargo/audit.toml).
      - run: cargo deny check
      - run: cargo audit

  gradle-wrapper:
    name: gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  jvm-test:
    name: jvm-test (shared + desktop)
    runs-on: ubuntu-latest
    needs: gradle-wrapper
    env:
      # Same rationale as integration-test below: the JVM test tasks do
      # not need Android, and the Ubique uniffi plugin's Android wiring
      # breaks on the runner's preinstalled SDK.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install libdbus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Run JVM tests
        # Compose resources read the screen resolution when strings are
        # resolved outside composition, which throws HeadlessException on
        # a runner without a display: run the tests on a virtual one.
        run: xvfb-run --auto-servernum ./gradlew :shared:jvmTest :apps:desktop:jvmTest --stacktrace
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-test-report
          path: |
            shared/build/reports/tests/
            apps/desktop/build/reports/tests/

  integration-test:
    name: integration-test (regtest + electrs)
    runs-on: ubuntu-latest
    needs: gradle-wrapper
    # Docker is preinstalled on ubuntu-latest runners and reachable
    # via the default unix socket, so no DOCKER_HOST gymnastics are
    # required (unlike on Windows). Pre-pulling the images keeps the
    # first Testcontainers boot under the default Wait timeout.
    env:
      # ubuntu-latest ships with Android SDK pre-installed, which the
      # shared module's hasAndroidSdk check picks up — but the Ubique
      # uniffi plugin's Android wiring expects task names AGP 8.9.x
      # has renamed, and explodes with "Task 'packageDebugResources'
      # not found". This integration-test job does not need Android
      # at all — it only drives the desktop JVM cdylib + bitcoind +
      # electrs — so we blank the env vars to fall back to the JVM-
      # only configuration.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install libdbus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Pre-pull container images
        run: |
          docker pull polarlightning/bitcoind:28.0
          docker pull mempool/electrs:v3.2.0
      - name: Run integration tests
        run: ./gradlew :apps:desktop:integrationTest --stacktrace
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-report
          path: apps/desktop/build/reports/tests/integrationTest/
