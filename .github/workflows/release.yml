name: Release

# A version tag (v0.1.0) builds the Windows installer from source, has it
# signed through SignPath (see CODE_SIGNING_POLICY.md) and attaches it to a
# draft GitHub release. Run by hand, it builds the installer as an
# artifact and publishes nothing.
#
# Signing starts once the repository has the SIGNPATH_ORGANIZATION_ID
# variable and the SIGNPATH_API_TOKEN secret. Until then the installer is
# published unsigned. Each signing request waits for an approver on
# SignPath.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# Supply chain: actions pinned to full commit SHAs, like ci.yml
# (download-artifact and the SignPath action resolved 2026-10-28).

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    # A cold build takes about 20 minutes; a hung step fails the job instead
    # of holding the runner for six hours.
    timeout-minutes: 90
    env:
      # As in ci.yml: the desktop build does not need Android, and the
      # uniffi plugin's Android wiring breaks on the preinstalled SDK.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^ *packageVersion = "\(.*\)"$/\1/p' apps/desktop/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packageVersion $version"
            exit 1
          fi
      # The Gradle build runs these two cargo steps too, but hides their
      # output. Run them first so a failure or a hang shows where it is;
      # Gradle then finds both up to date.
      #
      # Build steps run in pwsh, like the windows job in ci.yml: the vendored
      # OpenSSL (rusqlite bundled-sqlcipher-vendored-openssl) is configured
      # by perl, and only Strawberry Perl on the pwsh PATH has the modules it
      # needs. Git Bash's perl fails (first dry run: hung for hours in Gradle).
      - name: Build the uniffi bindgen
        shell: pwsh
        run: >-
          cargo install --locked --force --path crates/uniffi-bindgen-kmp
          --root shared/build/bindgen-install --target-dir build/bindgen-target
      - name: Build the Rust core
        shell: pwsh
        run: cargo build -p bhodl-uniffi
      - name: Build the MSI
        shell: pwsh
        # No build cache: a release is always built from a clean tree.
        run: ./gradlew.bat :apps:desktop:packageMsi --no-configuration-cache --stacktrace
      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bhodl-windows-unsigned
          path: apps/desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'bhodl' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'msi' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # The approver signs off by hand: leave them an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Collect the installer and its checksum
        shell: bash
        run: |
          mkdir dist
          if [ -d signed ]; then
            cp signed/*.msi dist/
          else
            echo "::warning::SignPath is not configured: the installer is unsigned"
            cp apps/desktop/build/compose/binaries/main/msi/*.msi dist/
          fi
          cd dist && sha256sum *.msi > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bhodl-windows
          path: dist/
          if-no-files-found: error

  publish:
    name: draft release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bhodl-windows
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Windows installer built from \`$GITHUB_REF_NAME\` by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Checksums in \`SHA256SUMS.txt\`.

          BHODL is alpha software and has not been audited. It is watch-only: it never holds private keys and cannot send bitcoin.

          - [Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/main/CODE_SIGNING_POLICY.md)
          - [Privacy policy](https://github.com/$GITHUB_REPOSITORY/blob/main/PRIVACY.md)
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "BHODL $GITHUB_REF_NAME" \
            --notes-file notes.md
