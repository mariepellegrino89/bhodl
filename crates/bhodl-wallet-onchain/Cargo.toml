[package]
name = "bhodl-wallet-onchain"
description = "Watch-only Bitcoin wallet primitives for BHODL: xpub / descriptor / address watch wallets plus the tracker registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
bhodl-core = { path = "../bhodl-core" }
bitcoin = { workspace = true }
thiserror = { workspace = true }
bdk_wallet = { workspace = true }
bdk_esplora = { workspace = true }
bdk_chain = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
# Phase 3 multi-wallet identity (UUIDv4 per registry entry).
uuid = { workspace = true }

[dev-dependencies]
# Test fixtures derive BIP-86 public keys from the spec mnemonic.
bip39 = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

# Regtest harness (bitcoind + electrs/esplora) for tests/regtest.rs.
# The `download` feature is deliberately OFF: it made the bitcoind /
# electrsd build scripts fetch and unpack the daemons with `zip` 0.6
# (RUSTSEC-2026-0367/0368/0369, no fixed release reachable through
# bdk_testenv 0.13 / electrsd 0.28 / bitcoind 0.36 / corepc-node 0.12).
# The binaries are now supplied at run time via BITCOIND_EXE and
# ELECTRS_EXE — `scripts/regtest-binaries.sh` downloads the same pinned
# artifacts and verifies their sha256. Kept Unix-only: electrsd signals
# electrs with SIGUSR1 (`trigger()`) and electrs ships no Windows build.
[target.'cfg(unix)'.dev-dependencies]
bdk_testenv = { version = "0.13", default-features = false, features = ["std"] }

[features]
# Enable tests that hit real network endpoints (CoinGecko, blockchain.info,
# Frankfurter). Off by default so `cargo test` stays fast and offline.
online-tests = []
# Tests that route through a REAL Tor daemon (src/tor_live_tests.rs).
# Proxy from BHODL_TOR_SOCKS (default socks5h://127.0.0.1:9050); they
# skip without Tor unless BHODL_TOR_REQUIRED is set. Run by the nightly
# `tor` workflow, never on pull requests. See scripts/tor-tests.sh.
tor-tests = []

[lints]
workspace = true
