[package]
name = "bhodl-uniffi"
description = "UniFFI bindings for BHODL: exposes the watch-only wallet and the tracker registry to Kotlin/Swift via uniffi-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Spike note: we keep this crate's source layout aligned with the Ubique
# uniffi-kotlin-multiplatform-bindings quickstart so the Gradle plugin can
# pick up the cdylib directly. The Rust source therefore lives under
# `src/commonMain/rust/lib.rs` instead of the conventional `src/lib.rs`.
# The cdylib + staticlib crate-types are required for KMP/JNI consumption.
[lib]
name = "bhodl_uniffi"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
bhodl-core = { path = "../bhodl-core" }
bhodl-wallet-onchain = { path = "../bhodl-wallet-onchain" }
uniffi = { workspace = true, features = ["cli"] }
thiserror = { workspace = true }
# registry.kdf.json — versioned salt + Argon2id params on disk so a future
# parameter bump does not lock existing wallets out (see KdfFile in lib.rs).
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
# Phase 3 multi-wallet identity (UUIDv4 per registry entry).
uuid = { workspace = true }
# Best-effort scrub of the device_key on RegistryHandle::drop.
zeroize = { workspace = true }
# T2-12 — HMAC-SHA256 over wallet.kdf.json content to detect tampering
# (downgrade attack: attacker swaps salt + params to force a weaker KDF).
# RustCrypto pure-Rust audited; both already transitive via rusqlite.
hmac = "0.12"
sha2 = "0.10"
# PIN recovery — the data key is wrapped (XChaCha20-Poly1305, RustCrypto)
# by the PIN-derived key and, separately, by the recovery-code key.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
# Test fixtures derive BIP-86 public keys from the spec mnemonic.
bip39 = { workspace = true }
bitcoin = { workspace = true }
# Raw access to the registry DB to fabricate pre-rework rows.
rusqlite = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

# Restore the full workspace lint set to this crate (a crate-local
# `[lints.*]` table WITHOUT `workspace = true` silently REPLACED the
# workspace table, dropping missing_debug_implementations, unreachable_pub
# and friends for the crate that handles PINs/keys).
#
# `[lints] workspace = true` alone is NOT usable here: this Cargo version
# rejects ANY `[lints.*]` override next to `workspace = true`, the
# workspace `unsafe_code = "forbid"` cannot be scoped per-item (forbid
# beats any `#[allow]`, E0453), and pedantic must stay crate-level for the
# UniFFI scaffolding. So the workspace lints are duplicated here with two
# documented deltas:
# - unsafe_code = "deny" (was forbid): lets the single test-only
#   heap-inspection block opt back in via #[allow(unsafe_code)] at the
#   item (lib.rs device_key zeroize test). The rest of the crate stays
#   unsafe-free — do not add more allow sites.
# - pedantic = allow: generated UniFFI scaffolding trips it; relaxing it
#   here keeps `cargo clippy --all-targets` green without polluting
#   bhodl-core. Tighten once the API stabilises.
# Keep this table in sync with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
