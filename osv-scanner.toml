# osv-scanner configuration (used by .github/workflows/osv-scan.yml).
#
# The scanner reads gradle/verification-metadata.xml, which lists EVERY
# artifact Gradle resolves, including the build tooling (Android Gradle
# Plugin, Kotlin/Compose Gradle plugins and their netty / bouncycastle /
# jackson / protobuf / httpclient transitives). None of the packages below
# is a direct dependency of this project (see gradle/libs.versions.toml)
# and none is on the :apps:desktop jvmRuntimeClasspath; they run on the
# developer or CI machine at build time only and are not shipped.
#
# Each override is pinned to an exact version on purpose: when a bump
# changes the tooling version, the new version is scanned again and the
# job fails until someone reviews it. Never add a package that ships in
# the app here; bump it instead. Review a candidate with:
#   ./gradlew :apps:desktop:dependencies --configuration jvmRuntimeClasspath

[[PackageOverrides]]
name = "com.fasterxml.jackson.core:jackson-core"
version = "2.20.1"
ecosystem = "Maven"
ignore = true
reason = "Build-tooling transitive (AGP / Gradle plugin classpath); not shipped"

