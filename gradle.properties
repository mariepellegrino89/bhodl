# --- JVM ---------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Kotlin ------------------------------------------------------------------
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
# Spike: silence noisy KMP warnings that don't apply to a fresh project.
kotlin.mpp.applyDefaultHierarchyTemplate=true
# Required by ch.ubique.uniffi.plugin so the bindings generation hooks into
# the `commonize` task and runs on every Sync. Without this the plugin fails
# fast in afterEvaluate (see UniffiPlugin.kt).
kotlin.mpp.enableCInteropCommonization=true

# --- Android -----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
# Required by AGP 8.x to avoid namespace warnings on libraries.
android.defaults.buildfeatures.buildconfig=false

# --- Compose -----------------------------------------------------------------
# Use the JetBrains Compose Compiler that ships paired with Kotlin via the
# org.jetbrains.kotlin.plugin.compose plugin (Kotlin 2.0+ pattern).
org.jetbrains.compose.experimental.jscanvas.enabled=true
